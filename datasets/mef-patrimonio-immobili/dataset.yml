root: "../../out"
schema_version: 1

dataset:
  name: "mef_patrimonio_immobili"
  source_id: "mef_de"
  tags: [finanza-pubblica, mef, patrimonio, immobili, geolocalizzazione]
  category: finanza-pubblica
  years: [2023]
  time_coverage: {start_year: 2023, end_year: 2023}

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python preprocess.py {year} raw_immobili_{year}.csv"
        output: "raw_immobili_{year}.csv"
        filename: "raw_immobili_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read: {source: auto, mode: latest, delim: ";", encoding: "utf-8", header: true, quote: '"'}
  required_columns:
    - anno
    - id_bene
    - amministrazione_denominazione
    - amministrazione_codice_fiscale
    - regione_bene
    - provincia_bene
    - comune_bene
    - latitudine
    - longitudine
    - tipologia_bene
    - utilizzo_bene
    - superficie_riferimento_mq
    - vincoli
    - natura_giuridica_bene
  validate:
    min_rows: 1000000
    not_null: [anno, id_bene]

mart:
  tables:
    - name: "mart_regioni"
      sql: "sql/mart_regioni.sql"
    - name: "mart_province"
      sql: "sql/mart_province.sql"
  required_tables: [mart_regioni, mart_province]
  validate:
    table_rules:
      mart_regioni:
        required_columns: [anno, regione_bene, totale, non_utilizzati, pct_inutilizzati]
        primary_key: [anno, regione_bene]
        min_rows: 15
      mart_province:
        required_columns: [anno, regione_bene, provincia_bene, totale]
        primary_key: [anno, regione_bene, provincia_bene]
        min_rows: 50

validation:
  fail_on_error: true
