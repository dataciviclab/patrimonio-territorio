[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "patrimonio-territorio"
version = "0.1.0"
description = "Mappa del patrimonio immobiliare pubblico italiano — MEF censimento immobili + detenzioni"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
    "pytest>=8.0",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/patrimonio-territorio"

[tool.pytest.ini_options]
markers = [
    "contract: interfaccia pubblica, artifact format, contratto API, path contract, output CI",
    "policy: regola Lab non ovvia o comportamento cross-component",
    "regression: bug fix documentato in issue/PR",
    "smoke: test che fa chiamate reali (richiede connettivita')",
]

[tool.toolkit.extends]
source_id = "patrimonio_territorio"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
