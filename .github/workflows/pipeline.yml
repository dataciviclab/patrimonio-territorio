name: pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "patrimonio_territorio"
      run-command: "make run"
      sync-pattern: "flat"
      python-extra-packages: "-e .[pipeline]"
      extra-env: "TOOLKIT_ALLOW_SCRIPT_SOURCE=1"
    secrets: inherit