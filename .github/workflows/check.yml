name: check

on:
  pull_request:
    paths:
      - "datasets/**"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.sql"
      - "**/Makefile"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dataciviclab/.github/actions/python-setup@main
      - run: pip install ruff
      - run: ruff check .

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dataciviclab/.github/actions/python-setup@main
      - run: make check
